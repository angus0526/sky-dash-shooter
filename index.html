<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="2D 跑酷/飛機/標靶射擊小遊戲，支援手機與電腦瀏覽器" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Sky Dash Shooter</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0f1a;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }
      /* touch-action:none above stops scroll/zoom/pan gestures, but a still-held finger
         (exactly what the joystick's 5s reposition hold looks like) is a different gesture
         class: iOS/Android's long-press text-selection callout / magnifier. That's governed
         by -webkit-touch-callout / user-select, not touch-action, and nothing else in this
         page (or Phaser itself) disables it — so a long hold on mobile got hijacked by the
         OS mid-gesture, cancelling the touch before the reposition could complete. */
      html, body, #app, canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      canvas {
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate-overlay {
        position: fixed;
        inset: 0;
        background: #0b0f1a;
        color: #e6ecff;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        text-align: center;
        z-index: 1000;
        padding: 24px;
      }
      #rotate-overlay.visible {
        display: flex;
      }
      #rotate-overlay .icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      #profile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 15, 26, 0.94);
        color: #e6ecff;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        z-index: 900;
        padding: 24px;
      }
      #profile-overlay.visible {
        display: flex;
      }
      #profile-overlay .card {
        width: 100%;
        max-width: 340px;
        background: #10162a;
        border: 2px solid #fff275;
        border-radius: 8px;
        padding: 24px;
        box-sizing: border-box;
      }
      #profile-overlay h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      #profile-overlay p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #8892b0;
      }
      #profile-overlay label {
        display: block;
        font-size: 13px;
        margin: 12px 0 4px;
        color: #c3cbe0;
      }
      #profile-overlay input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 4px;
        border: 1px solid #3a4266;
        background: #0b0f1a;
        color: #e6ecff;
        font-size: 14px;
      }
      #profile-overlay input:focus {
        outline: none;
        border-color: #4fd1ff;
      }
      #profile-status {
        min-height: 18px;
        font-size: 12px;
        color: #ff5470;
        margin-top: 10px;
      }
      #profile-start {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 4px;
        background: #fff275;
        color: #0b0f1a;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      #profile-start:active {
        opacity: 0.85;
      }
      #room-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 15, 26, 0.94);
        color: #e6ecff;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        z-index: 900;
        padding: 24px;
      }
      #room-overlay.visible {
        display: flex;
      }
      #room-overlay .card {
        width: 100%;
        max-width: 360px;
        background: #10162a;
        border: 2px solid #4fd1ff;
        border-radius: 8px;
        padding: 24px;
        box-sizing: border-box;
      }
      #room-overlay h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      #room-overlay p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #8892b0;
      }
      #room-overlay label {
        display: block;
        font-size: 13px;
        margin: 12px 0 4px;
        color: #c3cbe0;
      }
      #room-overlay input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 4px;
        border: 1px solid #3a4266;
        background: #0b0f1a;
        color: #e6ecff;
        font-size: 14px;
        text-transform: uppercase;
      }
      #room-overlay input:focus {
        outline: none;
        border-color: #4fd1ff;
      }
      .overlay-btn {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: none;
        border-radius: 4px;
        background: #4fd1ff;
        color: #0b0f1a;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .overlay-btn:active {
        opacity: 0.85;
      }
      .overlay-btn.secondary {
        background: transparent;
        border: 1px solid #3a4266;
        color: #c3cbe0;
        font-weight: 400;
      }
      .overlay-divider {
        text-align: center;
        font-size: 12px;
        color: #566;
        margin: 14px 0;
      }
      #room-code-display {
        color: #fff275;
        letter-spacing: 3px;
        font-family: monospace;
      }
      #room-peer-count {
        margin-top: 10px;
        font-size: 14px;
      }
      #room-status,
      #room-lobby-status {
        min-height: 18px;
        font-size: 12px;
        color: #ff5470;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-overlay">
      <div class="icon">&#8635;</div>
      <div>請將手機轉為橫向以開始遊戲</div>
    </div>
    <div id="profile-overlay">
      <div class="card">
        <h2>歡迎回來</h2>
        <p>輸入姓名開始新紀錄，或連同代碼一起輸入以還原上次進度。</p>
        <label for="profile-name">姓名</label>
        <input id="profile-name" type="text" maxlength="20" placeholder="你的名字" autocomplete="off" />
        <label for="profile-code">代碼（選填）</label>
        <input id="profile-code" type="text" placeholder="貼上先前取得的續玩代碼" autocomplete="off" />
        <div id="profile-status"></div>
        <button id="profile-start" type="button">開始</button>
      </div>
    </div>
    <div id="room-overlay">
      <div class="card">
        <div id="room-step-choice">
          <h2>遊戲模式</h2>
          <p>單人遊玩，或跟朋友一起連線闖關（最多 5 人，敵人/寶物/魔王會依人數增強）。</p>
          <button id="room-solo-btn" class="overlay-btn" type="button">單人遊玩</button>
          <button id="room-multi-btn" class="overlay-btn secondary" type="button">多人連線</button>
        </div>
        <div id="room-step-multi-choice" style="display: none">
          <h2>多人連線</h2>
          <button id="room-create-btn" class="overlay-btn" type="button">建立房間</button>
          <div class="overlay-divider">或</div>
          <label for="room-join-code">輸入房號加入</label>
          <input id="room-join-code" type="text" maxlength="5" placeholder="例如 A3F9K" autocomplete="off" />
          <button id="room-join-btn" class="overlay-btn" type="button">加入房間</button>
          <div id="room-status"></div>
          <button id="room-back-btn" class="overlay-btn secondary" type="button">返回</button>
        </div>
        <div id="room-step-lobby" style="display: none">
          <h2>房間代碼：<span id="room-code-display"></span></h2>
          <p>把房號分享給朋友，對方在「多人連線」選單輸入即可加入。</p>
          <div id="room-peer-count"></div>
          <button id="room-start-btn" class="overlay-btn" type="button" style="display: none">開始遊戲</button>
          <div id="room-lobby-status"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
